apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-api-config
  namespace: checkout-system
data:
  LOG_LEVEL: "info"
  PORT: "5000"
  # Required production backing services must be supplied by a Secret/External config source.
  # The current release candidate does not define DATABASE_URL or REDIS_URL in the target manifest.
  # Without these values, the application falls back to a volatile local SQLite cache and local in-memory Redis-style fallback.
  DATABASE_URL: "postgresql://checkout:REPLACE_ME@postgres.checkout-system.svc.cluster.local:5432/checkout"
  REDIS_URL: "redis://redis.checkout-system.svc.cluster.local:6379/0"
